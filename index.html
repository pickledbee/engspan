<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>English ♥ Español</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff7f2; --card:#ffffff; --ink:#2b2230; --muted:#5e5363;
    --en:#3b6fd8; --en-soft:#e8efff; --es:#e2574c; --es-soft:#ffe9e6;
    --line:#f0e3dc; --radius:18px;
    --wash:rgba(255,247,242,.40); --glass:rgba(255,250,247,.90);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c171f; --card:#262029; --ink:#f4ecf2; --muted:#c7bdcc;
      --en-soft:#22304f; --es-soft:#4a2522; --line:#3a3140;
      --wash:rgba(28,23,31,.50); --glass:rgba(38,32,41,.90); }
  }
  *{box-sizing:border-box}
  html{font-size:19px}
  html,body{margin:0;height:100%}
  body{line-height:1.45}
  body{background:var(--bg) url('bg.jpg') center 15% / cover no-repeat}
  body::before{content:'';position:fixed;inset:0;background:var(--wash);z-index:-1;pointer-events:none}
  .glass{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  body{color:var(--ink);font-family:Nunito,system-ui,sans-serif;
    height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{flex-shrink:0;padding:14px 16px 8px;padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;max-width:720px;width:100%;margin:0 auto}
  header h1{font-family:Fraunces,serif;font-weight:700;margin:0;font-size:1.5rem;flex:1;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header h1 .heart{color:var(--es)}
  .icon-btn{font:inherit;font-weight:700;font-size:.95rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:99px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .view{flex:1;min-height:0;width:100%;max-width:720px;margin:0 auto;padding:4px 14px 0;display:none;flex-direction:column}
  .view.on{display:flex}
  .scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0}
  .card h2{font-family:Fraunces,serif;font-size:1.25rem;margin:0 0 4px}
  .muted{color:var(--muted);font-size:1rem}
  label{display:block;font-weight:700;font-size:1rem;margin:12px 0 4px}
  input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;font-size:1.05rem;padding:12px 13px;border-radius:12px;
    border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:0}
  input:focus{border-color:var(--muted)}
  .btn{display:block;width:100%;font:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:14px;padding:14px;cursor:pointer;margin-top:12px;color:#fff;
    background:linear-gradient(135deg,var(--en),var(--es))}
  .btn.plain{background:var(--card);color:var(--ink);border:2px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .google{display:flex;align-items:center;justify-content:center;gap:10px}
  .google svg{flex-shrink:0}
  .link{background:none;border:0;color:var(--en);font:inherit;font-weight:700;cursor:pointer;padding:0;font-size:1rem}
  .or{text-align:center;color:var(--muted);margin:14px 0 2px;font-size:.95rem}
  .err{color:var(--es);font-size:1rem;margin-top:10px;min-height:1em}
  .ok{color:#2f9e6a}
  .seg{display:flex;gap:6px;margin-top:6px}
  .seg button{flex:1;font:inherit;font-weight:800;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
  .seg button.on[data-l=en]{border-color:var(--en);color:var(--en)}
  .seg button.on[data-l=es]{border-color:var(--es);color:var(--es)}
  .room-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);margin-top:8px;cursor:pointer}
  .room-row b{flex:1}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  .row .btn{width:auto;margin-top:0;padding:11px 16px}
  /* chat */
  #chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px 14px}
  .msg{max-width:86%;border-radius:var(--radius);padding:10px 13px;background:var(--card);border:1px solid var(--line)}
  .msg.them{align-self:flex-start}
  .msg.me{align-self:flex-end}
  .msg.en{border-left:5px solid var(--en)}
  .msg.es{border-left:5px solid var(--es)}
  .who{font-size:.9rem;font-weight:800;color:var(--muted);margin-bottom:3px}
  .main{font-size:1.3rem;line-height:1.45;font-weight:600;white-space:pre-wrap;word-wrap:break-word}
  .orig{font-size:1.05rem;color:var(--muted);margin-top:5px;white-space:pre-wrap}
  .tools{display:flex;gap:6px;margin-top:6px}
  .tools button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:5px 12px;cursor:pointer}
  .roombar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 0 6px;border-bottom:1px solid var(--line)}
  .roombar .members{flex:1;font-size:.95rem;color:var(--muted);min-width:120px}
  .composer{flex-shrink:0;border-top:1px solid var(--line);padding:8px 0 calc(12px + env(safe-area-inset-bottom))}
  .typing-lang{font-size:.95rem;color:var(--muted);margin-bottom:6px}
  .box{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:8px}
  textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:1.15rem;line-height:1.35;min-height:60px;max-height:160px;padding:6px}
  #send{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--en),var(--es))}
  #send:disabled{opacity:.5}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:1rem;display:none;z-index:9}
  .msg,.card{box-shadow:0 4px 18px rgba(0,0,0,.12)}
  header{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:0 0 18px 18px}
  .roombar{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:8px 10px;margin-top:6px;border-bottom:0}
  .composer{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px 18px 0 0;padding-left:10px;padding-right:10px;border-top:0}
  .center-msg{background:var(--glass);border-radius:16px;padding:10px 16px;text-align:center;color:var(--muted);margin:30px auto;max-width:420px;line-height:1.5}
</style>
</head>
<body>

<header>
  <h1 id="title">English <span class="heart">♥</span> Español</h1>
  <button class="icon-btn" id="outBtn" style="display:none">Sign out · Salir</button>
</header>

<!-- ENTER THE ROOM -->
<section class="view" id="vLogin"><div class="scroll">
  <div class="card">
    <h2>Private room · Sala privada</h2>
    <div class="muted">Only people with the room password can come in. · Solo con la contraseña de la sala.</div>
    <form id="loginForm">
      <label for="fName">Your name · Tu nombre</label>
      <input type="text" id="fName" autocomplete="given-name" maxlength="30" required>
      <label>I speak · Hablo</label>
      <div class="seg" id="langSeg">
        <button type="button" data-l="en">English</button>
        <button type="button" data-l="es">Español</button>
      </div>
      <label for="fPass">Room password · Contraseña de la sala</label>
      <input type="password" id="fPass" autocomplete="current-password" required>
      <button class="btn" type="submit" id="loginBtn">Enter · Entrar</button>
    </form>
    <div class="err" id="loginErr"></div>
  </div>
</div></section>

<!-- CHAT -->
<section class="view" id="vRoom">
  <div class="roombar">
    <div class="members" id="who"></div>
  </div>
  <div id="chat"><div class="center-msg">Loading… · Cargando…</div></div>
  <div class="composer">
    <div class="typing-lang">Typing in · Escribiendo en: <button class="link" id="typingLang"></button></div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="Type here… / Escribe aquí…"></textarea>
      <button id="send">Send<br><small style="font-weight:600;opacity:.9">Enviar</small></button>
    </div>
  </div>
</section>

<section class="view" id="vSetup"><div class="scroll"><div class="center-msg">
  Almost ready. The room hasn't been connected yet.<br>Casi listo.
</div></div></section>

<div class="toast" id="toast"></div>

<script>
// Paste your Google Apps Script web app URL (ends in /exec) between the quotes:
const API_URL = '';

(function(){
const $ = id => document.getElementById(id);
const views = ['vLogin','vRoom','vSetup'];
function show(v){ views.forEach(x=>$(x).classList.toggle('on', x===v)); }
function toast(t){ const el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',2400); }

const store = {
  get(k){ try{ return localStorage.getItem('engspan_'+k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('engspan_'+k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem('engspan_'+k); }catch(e){} }
};

if (!API_URL) { show('vSetup'); return; }

let token = store.get('token'), myName = store.get('name') || '', myLang = store.get('lang') || ((navigator.language||'').startsWith('es') ? 'es' : 'en');
let typingLang = myLang;
let msgs = new Map(), lastId = -1, rev = null, epoch = null, polling = false, timer = null;

async function api(action, data){
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ action, token }, data||{})) });
  const d = await r.json();
  if (!d.ok) { const e = new Error(d.error||'error'); e.code = d.error; throw e; }
  return d;
}

/* ---------- login ---------- */
function paintLang(){
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on', b.dataset.l===myLang));
}
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { myLang = b.dataset.l; paintLang(); });
$('fName').value = myName;
paintLang();

const errText = {
  wrong_password: 'Wrong password. · Contraseña incorrecta.',
  too_many_tries: 'Too many wrong tries. Wait 15 minutes. · Demasiados intentos. Espera 15 minutos.',
  password_not_set: 'The room password has not been set yet. · La contraseña aún no está configurada.',
  name_required: 'Type your name. · Escribe tu nombre.'
};
$('loginForm').onsubmit = async ev => {
  ev.preventDefault();
  $('loginErr').textContent = ''; $('loginBtn').disabled = true;
  try {
    const d = await api('login', { name: $('fName').value.trim(), lang: myLang, password: $('fPass').value });
    token = d.token; myName = d.name; myLang = d.lang;
    store.set('token', token); store.set('name', myName); store.set('lang', myLang);
    $('fPass').value = '';
    enterRoom(d.room);
  } catch(e){
    $('loginErr').textContent = errText[e.code] || 'Could not connect. Try again. · No se pudo conectar.';
  }
  $('loginBtn').disabled = false;
};

$('outBtn').onclick = async () => {
  try { await api('logout'); } catch(e){}
  leave();
};
function leave(){
  clearTimeout(timer); token = null; store.del('token');
  msgs.clear(); lastId = -1; rev = null; epoch = null;
  $('outBtn').style.display = 'none';
  $('title').innerHTML = 'English <span class="heart">♥</span> Español';
  show('vLogin');
}

/* ---------- room ---------- */
function enterRoom(room){
  if (room) $('title').textContent = room;
  $('outBtn').style.display = '';
  $('who').textContent = '👤 ' + myName + ' · ' + (myLang==='es' ? 'Español' : 'English');
  typingLang = myLang; paintTyping();
  msgs.clear(); lastId = -1; rev = null; epoch = null;
  show('vRoom');
  poll(true);
}
function paintTyping(){ $('typingLang').textContent = typingLang==='es' ? 'Español ⇄' : 'English ⇄'; }
$('typingLang').onclick = () => { typingLang = typingLang==='es'?'en':'es'; paintTyping(); };

async function poll(now){
  clearTimeout(timer);
  if (!token) return;
  if (polling) { schedule(); return; }
  polling = true;
  try {
    const d = await api('poll', { since: lastId, rev, epoch });
    if (!d.same) {
      if (d.fresh) msgs.clear();
      (d.msgs||[]).forEach(m => msgs.set(m.id, m));
      (d.deleted||[]).forEach(id => msgs.delete(id));
      lastId = d.lastId; rev = d.rev; epoch = d.epoch;
      if (d.room) $('title').textContent = d.room;
      render();
    }
  } catch(e){
    if (e.code === 'no_session') { toast('Please sign in again · Entra de nuevo'); leave(); polling = false; return; }
  }
  polling = false;
  schedule();
}
function schedule(){ timer = setTimeout(()=>poll(), document.hidden ? 15000 : 3000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) poll(true); });

function render(){
  const chat = $('chat');
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 140;
  const list = [...msgs.values()].sort((a,b)=>a.id-b.id);
  chat.innerHTML = '';
  if (!list.length) { chat.innerHTML = '<div class="center-msg">Say hi! · ¡Saluda!</div>'; return; }
  list.forEach(m => {
    const mine = m.name === myName;
    const showText = (m.from === myLang) ? m.text : (m.tr || m.text);
    const other = (m.from === myLang) ? m.tr : m.text;
    const el = document.createElement('div');
    el.className = 'msg ' + (mine?'me ':'them ') + (m.from==='es'?'es':'en');
    el.innerHTML = '<div class="who"></div><div class="main"></div>' + (other ? '<div class="orig"></div>' : '');
    el.querySelector('.who').textContent = mine ? 'You · Tú' : m.name;
    el.querySelector('.main').textContent = showText;
    if (other) el.querySelector('.orig').textContent = other;
    const tools = document.createElement('div'); tools.className = 'tools';
    if ('speechSynthesis' in window) {
      const b = document.createElement('button'); b.textContent = '🔊';
      const sayLang = (showText === m.text ? m.from : (m.from==='es'?'en':'es')) === 'es' ? 'es-MX' : 'en-US';
      b.onclick = () => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(showText); u.lang = sayLang; u.rate = .95; speechSynthesis.speak(u); } catch(e){} };
      tools.appendChild(b);
    }
    const c = document.createElement('button'); c.textContent = 'Copy';
    c.onclick = () => { try { navigator.clipboard.writeText(showText).then(()=>toast('Copied · Copiado')); } catch(e){} };
    tools.appendChild(c);
    if (mine) {
      const d = document.createElement('button'); d.textContent = 'Delete';
      d.onclick = async () => {
        if (!confirm('Delete this message? · ¿Borrar este mensaje?')) return;
        msgs.delete(m.id); render();
        try { await api('delete', { id: m.id }); } catch(e){ toast('Could not delete'); }
        poll(true);
      };
      tools.appendChild(d);
    }
    el.appendChild(tools);
    chat.appendChild(el);
  });
  if (nearBottom || list[list.length-1].name === myName) chat.scrollTop = chat.scrollHeight;
}

let sending = false;
async function send(){
  const text = $('input').value.trim();
  if (!text || sending) return;
  sending = true; $('send').disabled = true;
  try {
    const d = await api('send', { text, from: typingLang });
    $('input').value = ''; $('input').style.height = 'auto';
    msgs.set(d.msg.id, d.msg); render();
    poll(true);
  } catch(e){
    if (e.code === 'no_session') { leave(); }
    else toast('Could not send · No se envió');
  }
  sending = false; $('send').disabled = false; $('input').focus();
}
$('send').onclick = send;
$('input').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send(); } });
$('input').addEventListener('input', () => { const t=$('input'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,160)+'px'; });

if (token) enterRoom(null); else show('vLogin');
})();
</script>
</body>
</html>
